name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - name: Lint
        run: uvx ruff@0.14.0 check .
      # Core logic (normalization, categories, fusion, verdicts, API retry/cache, hosted service, worker mapping)
      # needs no models, so CI skips the multi-GB torch install.
      - name: Tests
        run: >-
          uv run --no-project --with pytest --with httpx --with numpy --with pillow==12.3.0
          --with fastapi==0.143.1 --with python-multipart==0.0.32 --with pillow-heif==1.8.1 pytest -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # scan the whole history, not just the last commit
      - name: Secret scan (gitleaks)
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4
          detect --source /repo --redact --no-banner -v
