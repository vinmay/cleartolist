[project]
name = "cleartolist"
version = "0.1.0"
description = "Check a photo of a secondhand item against U.S. CPSC product recalls before listing it. Runs on local open models."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pillow>=10.4",
    "numpy>=1.26",
    "torch>=2.4",
    "transformers>=4.50",
    "sentencepiece>=0.2",
    "protobuf>=5",
    "faiss-cpu>=1.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
