[project]
name = "cleartolist"
version = "0.1.0"
description = "Check a photo of a secondhand item against U.S. CPSC product recalls before listing it. Runs on local open models."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pillow>=10.4",
    "numpy>=1.26",
    "torch>=2.4",
    "transformers>=4.50",
    "sentencepiece>=0.2",
    "protobuf>=5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "matplotlib>=3.9",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data", ".notes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731", "B008"]  # B008: FastAPI File() defaults are idiomatic
