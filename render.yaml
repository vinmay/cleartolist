# Render Blueprint for the hosted ClearToList web service. It runs no vision models: photo scans are queued here
# and processed by a self-hosted GPU worker running open models (worker/worker.py), which polls over HTTPS.
# Recall data comes from the nightly "data-latest" GitHub release asset (see .github/workflows/refresh.yml).
# Secrets are never in this file: set them in the Render dashboard (sync: false).
services:
  - type: web
    name: cleartolist
    runtime: python
    plan: free
    buildCommand: pip install -r demo/requirements.txt
    # No access log: request lines would include client addresses.
    startCommand: uvicorn demo.server:app --host 0.0.0.0 --port $PORT --no-access-log --no-server-header
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CTL_DEMO_DB
        value: /tmp/demo.db
      - key: CTL_DEMO_DB_URL
        value: https://github.com/vinmay/cleartolist/releases/download/data-latest/demo.db
      # Kill switch: photo uploads are off unless this is 1 (lookup stays on). Set in the dashboard, so a Blueprint
      # sync never flips it; the admin endpoint can flip it instantly at runtime (scripts/killswitch.py).
      - key: CTL_UPLOADS_ENABLED
        sync: false
      - key: CTL_INVITE_CODES
        sync: false
      - key: CTL_WORKER_SECRET
        sync: false
      - key: CTL_ADMIN_SECRET
        sync: false
      # Invite requests (email, time, alert categories) live in the Postgres below; Render fills this in.
      - key: DATABASE_URL
        fromDatabase:
          name: cleartolist-db
          property: connectionString

databases:
  - name: cleartolist-db
    plan: free
    databaseName: cleartolist
    user: cleartolist
    ipAllowList: []  # no connections from outside Render; export goes through the signed admin endpoint
